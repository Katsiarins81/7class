<style>
  * { font-family: 'Inter', sans-serif; }
  body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
  }
  .glass {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(20px);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
  }
  .topic-card {
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .topic-card:hover {
    transform: translateY(-6px) scale(1.02);
    box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.2);
  }
  .answer-option {
    transition: all 0.25s ease;
    cursor: pointer;
  }
  .answer-option:hover:not(.disabled) {
    transform: translateX(5px);
    background: linear-gradient(135deg, #eef2ff, #e0e7ff);
    border-color: #6366f1;
  }
  .answer-option.selected {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white;
    border-color: #6366f1;
    transform: translateX(5px);
  }
  .answer-option.correct {
    background: linear-gradient(135deg, #10b981, #059669);
    color: white;
    border-color: #10b981;
  }
  .answer-option.wrong {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: white;
    border-color: #ef4444;
  }
  .answer-option.disabled {
    cursor: not-allowed;
    opacity: 0.7;
  }
  .fade-in {
    animation: fadeIn 0.5s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .progress-fill {
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .bounce-in {
    animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  }
  @keyframes bounceIn {
    0% { transform: scale(0.3); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .pulse-glow {
    animation: pulseGlow 2s infinite;
  }
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
    50% { box-shadow: 0 0 0 20px rgba(99, 102, 241, 0); }
  }
  .hero-bg {
    background-image: 
      radial-gradient(circle at 20% 50%, rgba(255,255,255,0.1) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(255,255,255,0.1) 0%, transparent 50%);
  }
  .float-math {
    animation: floatMath 6s ease-in-out infinite;
  }
  @keyframes floatMath {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-15px) rotate(5deg); }
  }
  .shimmer {
    background: linear-gradient(90deg, #6366f1, #8b5cf6, #ec4899, #8b5cf6, #6366f1);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 3s linear infinite;
  }
  @keyframes shimmer {
    to { background-position: 200% center; }
  }
  .timer-pulse {
    animation: timerPulse 1s infinite;
  }
  @keyframes timerPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
</style>

topics[0].questions[9] = { q: 'Найдите значение: 3(a + b) - 2a при a = 2, b = 3', options: ['11', '8', '12', '6'], correct: 0, explanation: '3(2 + 3) - 2·2 = 3·5 - 4 = 15 - 4 = 11' };

// ==================== СОСТОЯНИЕ ====================
let state = {
  screen: 'home', // home | quiz | result
  currentTopic: null,
  currentQuestion: 0,
  answers: [],
  selectedAnswer: null,
  answered: false,
  startTime: null,
  endTime: null,
  shuffledQuestions: [],
  timerInterval: null,
  timeLeft: 0
};

const QUIZ_TIME = 600; // 10 минут на тест

// ==================== УТИЛИТЫ ====================
function shuffleArray(arr) {
  const shuffled = [...arr];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}

// ==================== РЕНДЕРИНГ ====================
function render() {
  const app = document.getElementById('app');
  if (state.screen === 'home') renderHome(app);
  else if (state.screen === 'quiz') renderQuiz(app);
  else if (state.screen === 'result') renderResult(app);
}

function renderHome(app) {
  app.innerHTML = `
    <div class="fade-in">
      <header class="text-center mb-12 mt-8">
        <div class="inline-block mb-6 float-math text-7xl">🧠</div>

          Мат<span class="shimmer">Тест</span>

          <div class="bg-white/20 backdrop-blur px-4 py-2 rounded-full text-white text-sm">
            📚 8 тем
          </div>
          <div class="bg-white/20 backdrop-blur px-4 py-2 rounded-full text-white text-sm">

      <div class="glass rounded-3xl p-6 md:p-8 mb-8">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="topics-grid">
          ${topics.map((topic, idx) => `
            <div class="topic-card glass rounded-2xl p-5 cursor-pointer border-2 border-transparent hover:border-indigo-300 relative overflow-hidden"
                 onclick="startQuiz('${topic.id}')"

              <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br ${topic.color} opacity-10 rounded-full -mr-16 -mt-16"></div>
              <div class="relative flex items-start gap-4">
                <div class="text-5xl bg-gradient-to-br ${topic.color} w-16 h-16 rounded-2xl flex items-center justify-center flex-shrink-0 shadow-lg">
                  ${topic.icon}
                </div>
                <div class="flex-1">
                  <h3 class="font-bold text-lg text-gray-800 mb-1">${topic.title}</h3>
                  <p class="text-sm text-gray-500">${topic.description}</p>
                  <div class="mt-2 flex items-center gap-2">
                    <span class="text-xs bg-indigo-100 text-indigo-700 px-2 py-1 rounded-full font-medium">10 вопросов</span>
                    <span class="text-xs bg-purple-100 text-purple-700 px-2 py-1 rounded-full font-medium">~3 мин</span>

            </div>

      </div>

      <div class="glass rounded-3xl p-6 md:p-8">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">💡 Как проходить тест</h2>

          <div class="text-center">
            <div class="w-14 h-14 bg-gradient-to-br from-indigo-500 to-purple-500 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl font-bold mb-3">1</div>
            <h3 class="font-bold mb-2 text-gray-800">Выберите тему</h3>
            <p class="text-sm text-gray-500">Нажмите на карточку интересующей темы из списка выше</p>
          </div>
          <div class="text-center">
            <div class="w-14 h-14 bg-gradient-to-br from-blue-500 to-cyan-500 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl font-bold mb-3">2</div>
            <h3 class="font-bold mb-2 text-gray-800">Ответьте на вопросы</h3>
            <p class="text-sm text-gray-500">У вас 10 минут. После ответа читайте объяснение и переходите дальше</p>
          </div>
          <div class="text-center">
            <div class="w-14 h-14 bg-gradient-to-br from-green-500 to-emerald-500 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl font-bold mb-3">3</div>
            <h3 class="font-bold mb-2 text-gray-800">Получите результат</h3>
            <p class="text-sm text-gray-500">Узнайте оценку, разбор ошибок и рекомендации</p>
          </div>
        </div>
      </div>

      <footer class="text-center mt-8 text-white/70 text-sm">
        <p>© 2026 МатТест · Учись с удовольствием! 🚀</p>
      </footer>
    </div>
  `;
}

function startQuiz(topicId) {
  const topic = topics.find(t => t.id === topicId);
  state.currentTopic = topic;
  state.shuffledQuestions = shuffleArray(topic.questions);
  state.currentQuestion = 0;
  state.answers = [];
  state.selectedAnswer = null;
  state.answered = false;
  state.screen = 'quiz';
  state.startTime = Date.now();
  state.timeLeft = QUIZ_TIME;
  
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(updateTimer, 1000);
  
  render();
}

function updateTimer() {
  state.timeLeft--;
  const timerEl = document.getElementById('timer');
  if (timerEl) {
    timerEl.textContent = formatTime(state.timeLeft);
    if (state.timeLeft <= 60) timerEl.classList.add('timer-pulse');
  }
  if (state.timeLeft <= 0) {
    finishQuiz();
  }
}

function renderQuiz(app) {
  const topic = state.currentTopic;
  const q = state.shuffledQuestions[state.currentQuestion];
  const progress = ((state.currentQuestion) / state.shuffledQuestions.length) * 100;
  
  app.innerHTML = `
    <div class="fade-in">
      <div class="glass rounded-3xl p-6 md:p-8 mb-4">
        <div class="flex items-center justify-between mb-6 flex-wrap gap-4">
          <button onclick="goHome()" class="flex items-center gap-2 text-gray-600 hover:text-indigo-600 font-medium transition">
            <span>←</span> К темам
          </button>
          <div class="flex items-center gap-2 bg-gradient-to-r ${topic.color} text-white px-4 py-2 rounded-full">
            <span class="text-xl">${topic.icon}</span>
            <span class="font-semibold">${topic.title}</span>
          </div>
          <div class="flex items-center gap-3">
            <div class="bg-gray-100 px-4 py-2 rounded-full flex items-center gap-2">
              <span>⏱</span>
              <span id="timer" class="font-mono font-bold ${state.timeLeft <= 60 ? 'text-red-500 timer-pulse' : 'text-gray-700'}">${formatTime(state.timeLeft)}</span>
            </div>
          </div>
        </div>

        <div class="mb-2 flex justify-between text-sm font-medium text-gray-600">
          <span>Вопрос ${state.currentQuestion + 1} из ${state.shuffledQuestions.length}</span>
          <span>Ответов: ${state.answers.filter(a => a.correct).length}/${state.currentQuestion + (state.answered ? 1 : 0)}</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-2 overflow-hidden">
          <div class="progress-fill bg-gradient-to-r ${topic.color} h-full rounded-full" style="width: ${progress}%"></div>
        </div>
      </div>

      <div class="glass rounded-3xl p-6 md:p-8 mb-4">
        <div class="mb-6">
          <div class="inline-block bg-indigo-100 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full mb-3">ВОПРОС ${state.currentQuestion + 1}</div>
          <h2 class="text-xl md:text-2xl font-bold text-gray-800 leading-relaxed">${q.q}</h2>
        </div>

        <div class="space-y-3" id="answers-container">
          ${q.options.map((opt, idx) => `
            <div class="answer-option border-2 border-gray-200 rounded-xl p-4 flex items-center gap-4 ${state.selectedAnswer === idx ? 'selected' : ''} ${state.answered ? 'disabled' : ''} ${state.answered && idx === q.correct ? 'correct' : ''} ${state.answered && state.selectedAnswer === idx && idx !== q.correct ? 'wrong' : ''}"
                 onclick="${state.answered ? '' : `selectAnswer(${idx})`}">
              <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold flex-shrink-0 ${state.answered && idx === q.correct ? 'bg-white text-green-600' : state.answered && state.selectedAnswer === idx && idx !== q.correct ? 'bg-white text-red-600' : state.selectedAnswer === idx ? 'bg-white text-indigo-600' : 'bg-gray-100 text-gray-600'}">
                ${String.fromCharCode(65 + idx)}
              </div>
              <div class="flex-1 font-medium">${opt}</div>
              ${state.answered && idx === q.correct ? '<span class="text-2xl">✓</span>' : ''}
              ${state.answered && state.selectedAnswer === idx && idx !== q.correct ? '<span class="text-2xl">✗</span>' : ''}
            </div>
          `).join('')}
        </div>

        ${state.answered ? `
          <div class="mt-6 p-4 rounded-xl ${state.selectedAnswer === q.correct ? 'bg-green-50 border-2 border-green-200' : 'bg-orange-50 border-2 border-orange-200'} fade-in">
            <div class="flex items-start gap-3">
              <span class="text-2xl">${state.selectedAnswer === q.correct ? '🎉' : '💡'}</span>
              <div>
                <h4 class="font-bold mb-1 ${state.selectedAnswer === q.correct ? 'text-green-800' : 'text-orange-800'}">
                  ${state.selectedAnswer === q.correct ? 'Верно!' : 'Разбор'}
                </h4>
                <p class="${state.selectedAnswer === q.correct ? 'text-green-700' : 'text-orange-700'}">${q.explanation}</p>
              </div>
            </div>
          </div>
        ` : ''}
      </div>

      ${state.answered ? `
        <div class="flex justify-end fade-in">
          <button onclick="nextQuestion()" class="pulse-glow bg-gradient-to-r ${topic.color} text-white font-bold px-8 py-4 rounded-2xl shadow-lg hover:shadow-xl transition-all transform hover:scale-105 flex items-center gap-2">
            ${state.currentQuestion === state.shuffledQuestions.length - 1 ? 'Завершить тест' : 'Следующий вопрос'} <span>→</span>
          </button>
        </div>
      ` : ''}
    </div>
  `;
}

function selectAnswer(idx) {
  if (state.answered) return;
  state.selectedAnswer = idx;
  state.answered = true;
  
  const q = state.shuffledQuestions[state.currentQuestion];
  state.answers.push({
    question: q.q,
    selected: idx,
    correct: idx === q.correct,
    correctAnswer: q.correct,
    options: q.options,
    explanation: q.explanation
  });
  
  render();
}

function nextQuestion() {
  if (state.currentQuestion === state.shuffledQuestions.length - 1) {
    finishQuiz();
  } else {
    state.currentQuestion++;
    state.selectedAnswer = null;
    state.answered = false;
    render();
  }
}

function finishQuiz() {
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.endTime = Date.now();
  state.screen = 'result';
  render();
}

function goHome() {
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.screen = 'home';
  render();
}

function renderResult(app) {
  const total = state.shuffledQuestions.length;
  const correct = state.answers.filter(a => a.correct).length;
  const wrong = total - correct;
  const percentage = Math.round((correct / total) * 100);
  const timeSpent = Math.round((state.endTime - state.startTime) / 1000);
  
  let grade = '', gradeColor = '', emoji = '', message = '';
  if (percentage >= 90) { grade = '5 (отлично)'; gradeColor = 'from-green-500 to-emerald-500'; emoji = '🏆'; message = 'Превосходный результат! Ты отлично знаешь материал.'; }
  else if (percentage >= 70) { grade = '4 (хорошо)'; gradeColor = 'from-blue-500 to-cyan-500'; emoji = '🎉'; message = 'Хороший результат! Ещё немного практики и будет идеально.'; }
  else if (percentage >= 50) { grade = '3 (удовлетворительно)'; gradeColor = 'from-orange-500 to-amber-500'; emoji = '👍'; message = 'Неплохо, но стоит повторить некоторые темы.'; }
  else { grade = '2 (нужно подтянуть)'; gradeColor = 'from-red-500 to-rose-500'; emoji = '📚'; message = 'Не расстраивайся! Повтори теорию и попробуй снова.'; }
  
  app.innerHTML = `
    <div class="fade-in">
      <div class="glass rounded-3xl p-8 mb-6 text-center">
        <div class="text-8xl mb-4 bounce-in">${emoji}</div>
        <h1 class="text-3xl md:text-4xl font-black mb-2 text-gray-800">Результаты теста</h1>
        <p class="text-gray-500 mb-6">${state.currentTopic.icon} ${state.currentTopic.title}</p>
        
        <div class="bg-gradient-to-br ${gradeColor} rounded-3xl p-8 mb-6 text-white shadow-xl">
          <div class="text-7xl md:text-8xl font-black mb-2 bounce-in">${percentage}%</div>
          <div class="text-2xl font-bold mb-1">Оценка: ${grade}</div>
          <div class="text-white/90">${message}</div>
        </div>

        <div class="grid grid-cols-3 gap-4 mb-6">
          <div class="bg-green-50 rounded-2xl p-4">
            <div class="text-3xl mb-1">✅</div>
            <div class="text-2xl font-black text-green-600">${correct}</div>
            <div class="text-sm text-green-700 font-medium">Правильных</div>
          </div>
          <div class="bg-red-50 rounded-2xl p-4">
            <div class="text-3xl mb-1">❌</div>
            <div class="text-2xl font-black text-red-600">${wrong}</div>
            <div class="text-sm text-red-700 font-medium">Ошибок</div>
          </div>
          <div class="bg-blue-50 rounded-2xl p-4">
            <div class="text-3xl mb-1">⏱</div>
            <div class="text-2xl font-black text-blue-600">${formatTime(timeSpent)}</div>
            <div class="text-sm text-blue-700 font-medium">Время</div>
          </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 justify-center">
          <button onclick="startQuiz('${state.currentTopic.id}')" class="bg-gradient-to-r ${gradeColor} text-white font-bold px-6 py-3 rounded-2xl shadow-lg hover:shadow-xl transition-all transform hover:scale-105">
            🔄 Пройти ещё раз
          </button>
          <button onclick="goHome()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold px-6 py-3 rounded-2xl transition">
            🏠 К темам
          </button>
        </div>
      </div>

      <div class="glass rounded-3xl p-6 md:p-8">
        <h2 class="text-2xl font-bold mb-6 text-gray-800 flex items-center gap-2">
          📊 <span>Разбор ответов</span>
        </h2>
        <div class="space-y-3">
          ${state.answers.map((a, i) => `
            <div class="border-2 ${a.correct ? 'border-green-200 bg-green-50/30' : 'border-red-200 bg-red-50/30'} rounded-2xl p-4 fade-in" style="animation-delay: ${i * 50}ms">
              <div class="flex items-start gap-3">
                <div class="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 font-bold text-white ${a.correct ? 'bg-green-500' : 'bg-red-500'}">
                  ${a.correct ? '✓' : '✗'}
                </div>
                <div class="flex-1">
                  <p class="font-semibold text-gray-800 mb-2">${i + 1}. ${a.question}</p>
                  <div class="text-sm space-y-1">
                    ${a.correct ? `
                      <p class="text-green-700"><span class="font-semibold">Твой ответ:</span> ${a.options[a.selected]}</p>
                    ` : `
                      <p class="text-red-700"><span class="font-semibold">Твой ответ:</span> ${a.options[a.selected]}</p>
                      <p class="text-green-700"><span class="font-semibold">Правильный:</span> ${a.options[a.correctAnswer]}</p>
                    `}
                    <p class="text-gray-600 italic mt-2 bg-white/70 p-2 rounded-lg">💡 ${a.explanation}</p>
                  </div>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>

      <footer class="text-center mt-8 text-white/70 text-sm">
        <p>© 2026 МатТест · Продолжай учиться! 🚀</p>
      </footer>
    </div>
  `;
}

// Запуск
render();
</script>
